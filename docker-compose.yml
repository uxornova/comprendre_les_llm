services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: llm-backend
    environment:
      MODEL_NAME: ${MODEL_NAME:-gpt2}
      MAX_NEW_TOKENS: ${MAX_NEW_TOKENS:-150}
    volumes:
      - hf_cache:/root/.cache/huggingface   # modèles téléchargés une seule fois
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 120s
    networks:
      - llm-network

  nginx:
    image: nginx:alpine
    container_name: llm-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/src:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - llm-network

volumes:
  hf_cache:

networks:
  llm-network:
    driver: bridge
